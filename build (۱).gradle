// Compatibility shim for online builders that inject signingConfigs at project scope.
def signingConfigs(Closure c) {
    // The builder performs the actual APK signing.
    return null
}

plugins {
    id 'com.android.application'
}
android {
    namespace 'com.rubina.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rubina.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
